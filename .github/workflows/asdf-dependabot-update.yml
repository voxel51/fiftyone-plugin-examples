---
name: asdf dependabot update

on:
  schedule:
    # Tuesdays at 8 AM UTC (4 AM EDT, 3 AM EST), an hour before Dependabot.
    # The check-week job skips every other week to match Dependabot's tue%2.
    - cron: '0 8 * * 2'
  workflow_dispatch:

jobs:
  check-week:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check-week.outputs.run }}
    steps:
      - name: Check for a Dependabot week
        id: check-week
        run: |
          # Counts weeks from Monday 2018-12-31 (epoch 1546214400), as
          # fugit does for Dependabot's tue%2, so both run on the same Tuesdays.
          week=$(( ($(date -u +%s) - 1546214400) / 604800 ))
          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]] || (( week % 2 == 0 )); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Week ${week} is odd. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update-asdf:
    needs: check-week
    if: needs.check-week.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout voxel51/aloha-github-workflows
        uses: actions/checkout@v7.0.1
        with:
          repository: voxel51/aloha-github-workflows
          ref: main
          token: ${{ secrets.ORG_RO_ALOHA_GITHUB_WORKFLOWS_FG_PAT }}
          path: ./.github/actions/aloha-github-workflows
      - name: Install asdf CLI
        uses: asdf-vm/actions/setup@v4.0.1
      - name: Install asdf plugins
        uses: asdf-vm/actions/plugins-add@v4.0.1
      - name: Update asdf tools
        uses: ./.github/actions/aloha-github-workflows/.github/actions/asdf-dependabot-update/update-all
        with:
          patch-only: "python,nodejs"
          tool-versions-file: .tool-versions
          github-token: "${{ secrets.ORG_DEPENDABOT_UPDATE_PAT }}"
